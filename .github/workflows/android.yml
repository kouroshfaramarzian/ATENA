- uses: actions/checkout@v5

- uses: actions/setup-node@v5
  with:
    node-version: 22
    cache: npm

- name: Install dependencies
  run: npm ci

- name: Check Capacitor
  run: |
    ls node_modules/.bin
    npx cap --version

- name: Build web
  run: npm run build

- name: Sync Android
  run: npx cap sync android
